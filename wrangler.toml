# РДУГ-бот: два повністю окремі оточення (правила 7 і 8 CLAUDE.md).
# Верхній рівень навмисно без D1 і без cron: `wrangler d1 migrations apply` без `--env`
# не має куди йти й не потрапить у prod. Тригери між env не успадковуються — оголошені в кожному.
# Секрети (BOT_TOKEN, WEBHOOK_SECRET, ALLOWED_TG_IDS, MONITOR_PING_URL, ANTHROPIC_API_KEY) тут не живуть: `wrangler secret put … --env …`.
# GIT_SHA передає деплой: `wrangler deploy --env preview --var GIT_SHA:$(git rev-parse HEAD)`.
# prod викочує лише `npm run release` з main (scripts/release.sh, docs/RUNBOOK.md).
name = "adhd-bot"
main = "src/index.ts"
compatibility_date = "2026-11-18" # остання дата, яку підтримує workerd 2026-11-18 з wrangler 4.165
account_id = "3d91f58920a9d270ee8d634d17e164b1" # акаунт Дениса (єдиний у `wrangler whoami`)
workers_dev = false

[env.preview]
name = "adhd-bot-preview"
workers_dev = true
vars = { ENV = "preview" }

[env.preview.ai]
binding = "AI"

[env.preview.triggers]
crons = ["* * * * *"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "adhd-preview"
database_id = "1f12ad7f-3cc4-4124-9179-fc15d598cfeb"
migrations_dir = "migrations"

[env.production]
name = "adhd-bot-prod"
# Адреса prod — adhd-bot-prod.<піддомен>.workers.dev (open-questions «Фаза 3», рекомендація; чекає підтвердження Дениса).
# Без неї Worker недосяжний і вебхуку нікуди вказати (S3.10 п. 3). Свій домен — після MVP.
workers_dev = true
# Без зайвих публічних адрес <версія>-adhd-bot-prod.… з prod-біндингами: wrangler 4.165 за замовчуванням вмикає
# Preview URLs разом із workers.dev (рев'ю 3.3, Д5). Рішення про workers_dev (Q5) це не змінює.
preview_urls = false
vars = { ENV = "production" }

[env.production.ai]
binding = "AI"

[env.production.triggers]
crons = ["* * * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "adhd-prod"
database_id = "REPLACE_WITH_PROD_D1_ID" # ресурси prod створює крок 3.3 (спека 0.5.f), не 0.4
migrations_dir = "migrations"
