test = "npx vitest run --reporter=dot test/node/time.test.ts test/node/set-commands.test.ts test/worker/settings.test.ts"
timeout = 300

[[mutant]]
id = "M1"
file = "src/settings/choices.ts"
old = '''choices.filter((m) => !inQuietHours(q.quiet_from, q.quiet_to, m));'''
new = '''choices.filter(() => true);'''
why = "кнопки годин у тихих годинах показуються (В1: вечір 23:00 при тиші 23:00–08:00) -> червоніє 3.7.b / 3.7.i (↓ кнопки)"
match = "3.7.b"

[[mutant]]
id = "M2"
file = "src/settings/choices.ts"
old = '''comes: delay < TTL_MIN ? q.quiet_to : null'''
new = '''comes: delay <= TTL_MIN ? q.quiet_to : null'''
why = "межа TTL 180 хв: «прийде о 09:00» замість «не прийде» -> червоніє 3.7.h і digestPromise"
match = "3.7.h|digestPromise"

[[mutant]]
id = "M3"
file = "src/digests/schedule.ts"
old = '''      return ["digest_morning", "digest_weekly"];'''
new = '''      return ["digest_morning"];'''
why = "morning_at не переплановує тижневий огляд (В4) -> червоніє 3.7.g"
match = "3.7.g"

[[mutant]]
id = "M4"
file = "src/db/settings.ts"
old = '''if (oldMoment === null || oldMoment !== r.fire_at) continue; // не корінь планувальника (⏰ тощо)'''
new = '''if (oldMoment === null) continue; // не корінь планувальника (⏰ тощо)'''
why = "корені ⏰ (інша мить) переносяться як корені планувальника (В3) -> червоніє 3.8.f"
match = "3.8.f"

[[mutant]]
id = "M5"
file = "src/db/settings.ts"
old = '''const next = plannedFor(newItem, now, newS).find((p) => p.kind === r.kind);'''
new = '''const next = plannedFor(newItem, 0, newS).find((p) => p.kind === r.kind);'''
why = "фільтр минулого вимкнено: корінь, чия нова мить позаду, скасовується й нагадування зникає (В3) -> червоніє 3.7.f і 3.8.f"
match = "3.7.f|3.8.f"

[[mutant]]
id = "M6"
file = "src/db/settings.ts"
old = '''tzChanged && it.all_day === 1 && it.due_at !== null ? shiftedAllDay(it.due_at, oldS.tz, newS.tz) : it.due_at;'''
new = '''it.due_at;'''
why = "all_day не зберігає локальну дату при зміні поясу -> червоніє 3.8.a (північ Лісабона) і 3.8.b"
match = "3.8.a"

[[mutant]]
id = "M7"
file = "src/digests/schedule.ts"
old = '''      return [...DIGEST_ORDER];'''
new = '''      return ["digest_morning"];'''
why = "зміна поясу переплановує лише ранок -> червоніє 3.8.c (вечір і тиждень лишились за старим поясом)"
match = "3.8.c"

[[mutant]]
id = "M8"
file = "src/db/settings.ts"
old = '''AND status = 'pending' AND (lease_until IS NULL OR lease_until <= ?3)`,'''
new = '''AND status = 'pending' AND (lease_until IS NULL OR lease_until <= ?3 OR 1)`,'''
why = "корінь під активною орендою теж переноситься (його вже відправляють) -> червоніє «корінь під активною орендою»"
match = "активною орендою"

[[mutant]]
id = "M9"
file = "src/db/settings.ts"
old = '''if (old === null || old[change.field] === change.value) return false;'''
new = '''if (old === null) return false;'''
why = "те саме значення знову скасовує й перепланує огляди (подвійний тап) -> червоніє «день тижня: …той самий день — нічого не змінює»"
match = "день тижня"

[[mutant]]
id = "M10"
file = "src/settings/handler.ts"
old = '''    if (!allowed.includes(minute)) {'''
new = '''    if (false && !allowed.includes(minute)) {'''
why = "застаріла кнопка години в тиші застосовується (В1: тиша змінилась після показу) -> червоніє «застаріла кнопка»"
match = "застаріла кнопка"

[[mutant]]
id = "M11"
file = "src/settings/tz.ts"
old = '''|| !/^[A-Za-z][A-Za-z0-9_+\-/]*$/.test(name)'''
new = '''|| false'''
why = "форма назви не перевіряється: «+02:00», «<b>» і сміття доходять до Intl -> червоніє parseTz і 3.7.c"
match = "parseTz|3.7.c"

[[mutant]]
id = "M12"
file = "src/db/settings.ts"
old = '''`UPDATE items SET planned_at = NULL'''
new = '''`UPDATE items SET planned_at = planned_at'''
why = "перенесений запис не повертається планувальнику (planned_at лишається) -> червоніє 3.7.f (planned_at запису завтра = NULL)"
match = "3.7.f"

[[mutant]]
id = "M13"
file = "src/db/settings.ts"
old = '''             WHERE EXISTS (SELECT 1 FROM reminders o WHERE o.id = json_extract(j.value, '$[4]')'''
new = '''             WHERE 0 AND EXISTS (SELECT 1 FROM reminders o WHERE o.id = json_extract(j.value, '$[4]')'''
why = "новий корінь не вставляється одразу (покладались на планувальник, а він не створює kind, що вже мав скасований корінь) -> червоніє 3.7.f і 3.8.b"
match = "3.7.f|3.8.b"

[[mutant]]
id = "M14"
file = "src/digests/schedule.ts"
old = '''      return ["digest_evening"];'''
new = '''      return ["digest_evening", "digest_morning"];'''
why = "зміна вечора зачіпає й ранковий огляд -> червоніє «вечір міняє лише digest_evening»"
match = "вечір міняє"

[[mutant]]
id = "M15"
file = "src/db/settings.ts"
old = '''const fireAt = nextDigestAt(kind, newS, now, last);'''
new = '''const fireAt = nextDigestAt(kind, oldS, now, last);'''
why = "огляд плануються за СТАРИМИ налаштуваннями -> червоніє 3.7.a, 3.7.g, 3.8.c"
match = "3.7.a|3.7.g|3.8.c"

[[mutant]]
id = "M16"
file = "scripts/set-commands.mjs"
old = '''  { command: "export", description: "мої дані одним файлом" },'''
new = '''  { command: "export", description: "мої дані одним файлом" },
  { command: "quiet", description: "тиха ніч" },'''
why = "/quiet потрапляє в меню (S3.9: /quiet і пояс — у /settings) -> червоніє тест складу меню"
match = "меню:"

[[mutant]]
id = "M17"
file = "src/time.ts"
old = '''  return resolveWall(Date.UTC(y, m - 1, d), tz);'''
new = '''  const wall = Date.UTC(y, m - 1, d);
  const first = wall - offsetAt(wall, tz);
  return wall - offsetAt(first, tz);'''
why = "dayBounds: старе наближення «два кроки» — 24 год замість 23 для Santiago -> червоніє 3.8.d"
match = "3.8.d"
