# Мутанти кроку 3.3 (scripts/release-lib.mjs, scripts/release.sh) — кожен ламає одне рішення «можна далі / стоп».
# Запуск після коміту:  python scripts/mutate.py docs/mutants/3.3.toml --report docs/mutants/3.3.md
test = "npx vitest run --project node --reporter=dot test/node/release.test.ts test/node/wrangler-config.test.ts"
timeout = 300

[[mutant]]
id = "M1"
file = "scripts/release-lib.mjs"
old = '''return dryRun ? { fatal: [], warn: problems } : { fatal: problems, warn: [] };'''
new = '''return { fatal: [], warn: problems };'''
why = "реліз без --dry-run не відмовляє на гілці"
match = 'без --dry-run: СТОП на кроці git'

[[mutant]]
id = "M2"
file = "scripts/release-lib.mjs"
old = '''else if (head !== originMain)'''
new = '''else if (false)'''
why = "HEAD ≠ origin/main не помічається"
match = 'гілка \(HEAD ≠ origin/main\) без --dry-run'

[[mutant]]
id = "M3"
file = "scripts/release-lib.mjs"
old = '''if (!head || !originMain) problems.push'''
new = '''if (false) problems.push'''
why = "не прочитаний origin/main рахується як «збігається»"
match = 'не прочитали origin/main'

[[mutant]]
id = "M4"
file = "scripts/release-lib.mjs"
old = '''if (id === "" || id === PLACEHOLDER_D1_ID) {'''
new = '''if (id === "") {'''
why = "заглушка REPLACE_WITH_PROD_D1_ID рахується створеною БД"
match = 'заглушка REPLACE_WITH_PROD_D1_ID'

[[mutant]]
id = "M5"
file = "scripts/release-lib.mjs"
old = '''if (typeof b !== "string" || !/^[0-9a-f]{8}(-[0-9a-f]+){3}$/.test(b))'''
new = '''if (typeof b !== "string")'''
why = "порожній чи вигаданий bookmark іде в rollback.txt"
match = 'bookmark: не JSON або не схожий'

[[mutant]]
id = "M6"
file = "scripts/release-lib.mjs"
old = '''if (!/Migrations to be applied/i.test(text)) return null;'''
new = '''if (false) return null;'''
why = "помилка API в migrations list читається як «нових міграцій немає»"
match = 'migrations list: нічого'

[[mutant]]
id = "M7"
file = "scripts/release-lib.mjs"
old = '''return REQUIRED_SECRETS.filter((n) => !names.has(n));'''
new = '''return [];'''
why = "реліз без секретів (monitor missing, бот без токена)"
match = 'секрети: назви НФ-8'

[[mutant]]
id = "M8"
file = "scripts/release-lib.mjs"
old = '''const cronActive = /schedule:\s*\* \* \* \* \*/.test(text);'''
new = '''const cronActive = true;'''
why = "деплой без активного cron проходить"
match = 'deploy без schedule'

[[mutant]]
id = "M9"
file = "scripts/release-lib.mjs"
old = '''new RegExp(`https://${esc}\\.[a-z0-9-]+\\.workers\\.dev`)'''
new = '''new RegExp(`https://[a-z0-9-]+\\.[a-z0-9-]+\\.workers\\.dev`)'''
