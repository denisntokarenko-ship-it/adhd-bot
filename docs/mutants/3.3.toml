match = 'адреса preview за prod не рахується'

[[mutant]]
id = "M10"
file = "scripts/release-lib.mjs"
old = '''if (body.sha !== sha) problems.push'''
new = '''if (false) problems.push'''
why = "/health зі старим sha (деплой не доїхав) — зелений"
match = 'старий sha'

[[mutant]]
id = "M11"
file = "scripts/release-lib.mjs"
old = '''if (body.cron?.stale !== false) problems.push'''
