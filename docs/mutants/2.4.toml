[[mutant]]
id = "M1"
file = "src/quiet.ts"
old = '''n < 1 || n > PAUSE_MAX_H'''
new = '''n < 1 || n > 240'''
why = "поріг /pause N: 24 → 240 (25 год приймається)"
match = "N поза 1–24"

