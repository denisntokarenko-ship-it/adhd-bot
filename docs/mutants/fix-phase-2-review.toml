file = "src/ai/prompt.ts"
old = ''' Сигнал діє незалежно від місця у фразі: «важливо купити хліб», «через 2 хв важливо подзвонити мамі», «купити хліб, це важливо» — усе "important".'''
new = ''''''
why = "Б3 (в): «важливо» в середині фрази знову не гарантує important"
