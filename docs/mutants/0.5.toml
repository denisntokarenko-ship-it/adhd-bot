test = "npx vitest run --reporter=dot"
timeout = 300

[[mutant]]
id = "M1"
file = "src/scheduled.ts"
old = '''  const db = openDb(env);
  try {
    await heartbeat(db, KEY, clock.now());
  } catch (err) {
    console.error("cron: heartbeat write failed", err instanceof Error ? err.name : "unknown");
    throw err;
  }
  await pingMonitor(env, clock);'''
new = '''  const db = openDb(env);
  await pingMonitor(env, clock);
  await heartbeat(db, KEY, clock.now());
  throw new Error("ping boom");'''
why = "пінг до запису серця + виняток -> червоніє 0.3.d (fetch не має викликатись) і «пінг падає»"
match = "0.3"

