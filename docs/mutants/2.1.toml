[[mutant]]
id = "M1"
file = "src/reminders/plan.ts"
old = '''if (row.attempt < row.max_attempts) {'''
new = '''if (row.attempt <= row.max_attempts) {'''
why = "attempt < max → ≤ : після 4-ї спроби з'являється 5-та -> червоніє «рівно 4 спроби»"
match = "рівно 4 спроби"
test = "npx vitest run --project node --reporter=dot test/node/reminders-plan.test.ts"

