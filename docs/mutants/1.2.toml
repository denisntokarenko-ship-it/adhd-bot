test = "npx vitest run --reporter=dot"
timeout = 300

[[mutant]]
id = "M1"
file = "src/ai/parse.ts"
old = '''const past = raw.all_day ? dueAt < dayBounds(tz, now)[0] : dueAt <= now;'''
new = '''const past = false;'''
why = "прибрано перевірку «дата в минулому» -> минулий час зберігається як due_at -> червоніє тест валідації «час сьогодні вже минув»"
match = "час сьогодні вже минув"

[[mutant]]
id = "M2"
file = "src/ai/parse.ts"
old = '''>= ctx.dailyLimit) return { fallback: true, reason: "limit" };'''
new = '''>= Infinity) return { fallback: true, reason: "limit" };'''
why = "прибрано перевірку денного ліміту -> виклик іде попри вичерпаний ліміт -> червоніє «ліміт вичерпано → fallback без виклику ШІ»"
match = "ліміт вичерпано"

[[mutant]]
id = "M3"
file = "src/ai/parse.ts"
old = '''    await record(false, kind, 0, 0);
    return { fallback: true, reason: "unavailable" };'''
new = '''    await record(false, kind, 0, 0);
    throw e;'''
why = "catch кидає далі замість fallback -> збій ШІ губить захоплення -> червоніє «ШІ кидає 500»"
match = "ШІ кидає 500"

[[mutant]]
id = "M4"
file = "src/ai/parse.ts"
old = '''dueAt <= now;'''
new = '''dueAt < now;'''
why = "`<=` -> `<`: час рівно зараз вважається майбутнім -> червоніє «час рівно зараз → минуле»"
match = "час рівно зараз"

[[mutant]]
id = "M5"
file = "src/ai/parse.ts"
old = '''>= ctx.dailyLimit) return'''
new = '''> ctx.dailyLimit) return'''
why = "`>=` -> `>` у ліміті: дозволено ліміт+1 викликів -> червоніє «ліміт вичерпано»"
match = "ліміт вичерпано"

[[mutant]]
id = "M6"
file = "src/ai/parse.ts"
old = '''nowLocal: localIso(now, tz),'''
new = '''nowLocal: new Date(now).toISOString().slice(0, 16),'''
why = "now_local з UTC-дати замість київської -> о 00:30 у промпті «вчора» -> червоніє 1.3.f"
match = "1.3.f: 00:30 за Києвом"

[[mutant]]
id = "M7"
file = "src/ai/prompt.ts"
old = '''return text.replace(/<(\/?\s*message\b)/gi, "&lt;$1");'''
new = '''return text;'''
why = "закривний тег у тексті не екранується -> з розділювачів можна «вийти» -> червоніє 1.2.g"
match = "1.2.g"

[[mutant]]
id = "M8"
file = "src/ai/schema.ts"
old = '''return have.length === keys.length && keys.every((k) => Object.hasOwn(o, k));'''
new = '''return keys.every((k) => Object.hasOwn(o, k));'''
why = "зайві поля дозволені (лише наявність потрібних) -> червоніє «зайве поле запису»"
match = "зайве поле запису"

[[mutant]]
id = "M9"
file = "src/ai/schema.ts"
old = '''items.length > MAX_ITEMS'''
new = '''items.length > 1000'''
why = "ліміт 20 записів знято -> 21 запис проходить -> червоніє «21 запис»"
match = "21 запис"

[[mutant]]
id = "M10"
