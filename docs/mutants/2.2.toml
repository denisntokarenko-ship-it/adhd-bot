test = "npx vitest run --project workers --reporter=dot test/worker/dispatch.test.ts"
timeout = 300

[[mutant]]
id = "M1"
file = "src/db/reminders.ts"
old = '''      .prepare("UPDATE items SET status = 'done', done_at = ?3 WHERE id = ?2 AND user_id = ?1 AND status = 'open'")'''
new = '''      .prepare("UPDATE items SET status = 'done', done_at = ?3 WHERE id = ?2 AND user_id = ?1")'''
why = "прибрати перевірку «вже done» перед закриттям: повторний ✅ знов «закриває» запис (done_at зсувається, відповідь «Зроблено!» замість «це вже зроблено») -> червоніє подвійний ✅"
match = "2.4.a/b"

[[mutant]]
id = "M1b"
file = "src/db/points.ts"
old = '''SELECT ?1, ?4, 'done', id, ?3 FROM items WHERE id = ?2 AND user_id = ?1 AND status = 'open''''
new = '''SELECT ?1, ?4, 'done', id, ?3 FROM items WHERE id = ?2 AND user_id = ?1'''
why = "очки без умови open: ux_ledger_done відсікає друге +10 за той самий запис, але НЕ захищає released — ✅ зі старого повідомлення на відпущений запис дав би очко -> червоніє 2.4.i (не еквівалент: перевірено мутацією)"
match = "2.4.i"

[[mutant]]
id = "M2"
file = "src/db/reminders.ts"
old = '''    doneStatement(userId, db, itemId, now),
    d1
      .prepare(`UPDATE reminders SET status = 'cancelled', lease_until = NULL WHERE user_id = ?1 AND item_id = ?2 AND status = 'pending' AND ${ITEM_OPEN}`)'''
new = '''    doneStatement(userId, db, itemId, now),
    d1
      .prepare(`UPDATE reminders SET status = 'cancelled', lease_until = NULL WHERE user_id = ?1 AND item_id = ?2 AND status = 'never' AND ${ITEM_OPEN}`)'''
why = "✅ без answer (pending запису не скасовуються): нащадок повтору лишається pending -> червоніє «повтор не йде»"
match = "2.5.e/2.2.f"

[[mutant]]
id = "M3"
file = "src/reminders/plan.ts"
old = '''export const PUSH_SINGLE_PER_HOUR = 6;'''
new = '''export const PUSH_SINGLE_PER_HOUR = 60;'''
why = "поріг окремих пушів 6 -> 60: 8 нагадувань підуть вісьмома окремими -> червоніє тест зведення"
match = "2.6.a"

[[mutant]]
id = "M4"
file = "src/db/reminders.ts"
old = '''         WHERE id = ?1 AND user_id = ?2 AND status = 'pending'`,
      )
      .bind(r.id, userId, f.sentAt, f.sentAs, f.tgMessageId, f.variantIdx),'''
new = '''         WHERE id = ?1 AND user_id = ?2`,
      )
      .bind(r.id, userId, f.sentAt, f.sentAs, f.tgMessageId, f.variantIdx),'''
