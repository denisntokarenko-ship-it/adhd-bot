match = "2.5.c"

[[mutant]]
id = "M5"
file = "src/db/reminders.ts"
old = '''         WHERE i.id = ?2 AND i.user_id = ?1 AND i.status = 'open' AND ${pressedSent}
         ON CONFLICT DO NOTHING`,'''
new = '''         WHERE i.id = ?2 AND i.user_id = ?1 AND i.status = 'open'
