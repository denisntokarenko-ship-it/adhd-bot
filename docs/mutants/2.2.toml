match = "2.3.e"

[[mutant]]
id = "M11"
file = "src/reminders/dispatch.ts"
old = '''    if (item === undefined || item.status !== "open") {
      await cancelOne(userId, db, r.id);
      c.unsent.delete(r.id);
    } else live.push({ r, item });'''
new = '''    if (item === undefined) {
      await cancelOne(userId, db, r.id);
      c.unsent.delete(r.id);
    } else live.push({ r, item });'''
why = "рання перевірка «запис open» прибрана — лишається лише перевірка безпосередньо перед відправкою (2.5.b): закриті записи займають місце в добору (6 окремих + зведення з одного замість 5 окремих) -> червоніє «закриті записи не займають місця»"
match = "закриті записи не займають місця"
