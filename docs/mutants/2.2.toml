[[mutant]]
id = "M8"
file = "src/reminders/dispatch.ts"
old = '''if (err.error_code === 400 || err.error_code === 403) return { kind: "dead", code: err.error_code };'''
new = '''if (err.error_code === 400) return { kind: "dead", code: err.error_code };'''
why = "403 (бота заблоковано) не гасить рядок, а повторюється без кінця -> червоніє «403 → cancelled»"
match = "403"

[[mutant]]
id = "M9"
file = "src/reminders/dispatch.ts"
old = '''const claimed = await claimDueReminders(db, start, CLAIM_LIMIT, quiet);'''
new = '''const claimed = await claimDueReminders(db, start, CLAIM_LIMIT, []);'''
why = "множина тихих користувачів не передається в claim: бот пише вночі -> червоніє 2.9.a"
match = "2.9.a"

[[mutant]]
id = "M10"
file = "src/reminders/dispatch.ts"
old = '''await releaseLeases(db, [...unsent]);'''
new = '''await releaseLeases(db, []);'''
