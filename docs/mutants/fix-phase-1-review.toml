old = '''if (c.pause_until !== null && c.pause_until > now) continue;
    if (inQuietHours(c.quiet_from, c.quiet_to, minutesOfDay(now, c.tz))) continue;'''
new = '''if (c.pause_until !== null && c.pause_until > now) continue;'''
